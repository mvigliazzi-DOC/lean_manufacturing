<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Memória — Gestão da Qualidade (SENAI)</title>
<!-- PeerJS CDN para conexão P2P online via Token -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root {
  --senai-blue: #0046ad;
  --senai-red: #e30613;
  --bg-color: #eef5ff;
  --card-bg: #ffffff;
  --text-color: #17233c;
  --border-color: #d7e4f8;
  --accent-green: #38a65a;
  --accent-green-bg: #e9f7ee;
}

*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg-color);color:var(--text-color)}
header{background:var(--senai-blue);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.header-brand{display:flex;align-items:center;gap:18px}
.logo{background:var(--senai-red);color:#fff;font-weight:900;font-style:italic;font-size:26px;padding:4px 12px;border-radius:4px}
h1{font-size:24px;margin:0;color:#fff}
main{max-width:1100px;margin:auto;padding:24px 18px 40px}
.intro,.stat,.board-wrap,.mode-selection{background:var(--card-bg);border-radius:16px;box-shadow:0 5px 20px rgba(0,40,100,.10)}
.intro{padding:20px;margin-bottom:18px}
.intro h2{margin:0 0 7px;color:var(--senai-blue);font-size:22px}
.intro p{margin:0;font-size:15px;color:#34415b}

/* Painel de Modos de Jogo */
.mode-selection{padding:20px;margin-bottom:18px;display:flex;flex-direction:column;gap:15px}
.mode-options{display:flex;gap:12px;flex-wrap:wrap}
.mode-btn{flex:1;min-width:150px;padding:12px;border:2px solid var(--senai-blue);background:#fff;color:var(--senai-blue);font-weight:800;border-radius:10px;cursor:pointer;font-size:16px;transition:all .2s}
.mode-btn.active{background:var(--senai-blue);color:#fff}

.multiplayer-setup{display:none;flex-direction:column;gap:12px;background:#f0f5ff;padding:15px;border-radius:12px;border:1px solid #c0d4f5}
.multiplayer-setup.show{display:flex}
.input-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input-group label{font-weight:700;font-size:14px;color:#17233c}
.input-group input{padding:8px 12px;border-radius:8px;border:1px solid #a0bce8;font-size:15px;background:#fff;color:#17233c}
.token-display{font-size:18px;font-weight:900;color:var(--senai-red);letter-spacing:2px;background:#fff;padding:6px 12px;border-radius:8px;border:1px dashed var(--senai-red);user-select:all}

.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
button.btn-action{border:0;background:#075ed7;color:white;font-size:16px;font-weight:800;border-radius:10px;padding:12px 22px;cursor:pointer;transition:transform 0.2s}
button.btn-action:hover{transform:scale(1.02)}
button.btn-action:disabled{background:#a0bce8;cursor:not-allowed}

/* Botão do Tutorial */
button.btn-tutorial{border:2px solid #fff;background:var(--senai-red);color:white;font-size:15px;font-weight:800;border-radius:8px;padding:8px 16px;cursor:pointer;transition:transform 0.2s}
button.btn-tutorial:hover{transform:scale(1.05)}

/* Modal do Tutorial */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;padding:15px}
.modal-overlay.show{display:flex}
.modal-content{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.3);position:relative}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #eef5ff;padding-bottom:12px;margin-bottom:16px}
.modal-header h3{margin:0;color:var(--senai-blue);font-size:22px}
.modal-close{background:transparent;border:0;font-size:24px;font-weight:900;color:#888;cursor:pointer}
.modal-body h4{color:var(--senai-red);margin:16px 0 6px 0;font-size:16px}
.modal-body p, .modal-body ul{margin:0 0 10px 0;font-size:14px;line-height:1.5;color:#34415b}
.modal-body ul{padding-left:20px}

.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{padding:11px 16px;font-weight:800}

/* Lista de Jogadores Multiplayer */
.players-panel{display:none;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.players-panel.show{display:flex}
.player-card{background:#fff;border:2px solid var(--border-color);padding:10px 16px;border-radius:10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.player-card.active-turn{border-color:var(--senai-red);background:#fff0f1;box-shadow:0 0 8px rgba(227,6,19,.3)}
.player-card .score{background:var(--senai-blue);color:#fff;padding:2px 8px;border-radius:12px;font-size:12px}

.message{text-align:center;min-height:28px;color:var(--senai-blue);font-weight:800;margin:10px 0}
.success{display:none;text-align:center;background:var(--accent-green-bg);border:2px solid var(--accent-green);color:#16733a;font-weight:900;border-radius:12px;padding:12px;margin:10px 0}
.success.show{display:block}

/* Abas de Navegação entre Páginas */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{flex:1;padding:14px;background:var(--border-color);border:0;border-radius:12px;font-size:15
